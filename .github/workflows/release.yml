name: Release

# Publishes a GitHub Release when a version tag is pushed (git tag v1.2.3).
# The app's built-in updater reads these releases, so asset names matter:
# they must follow lib/update/asset_selector.dart.
#
# NOT YET RUN. First use will likely need small fixes; try it on a throwaway
# tag such as v0.0.1-test.1 (tags containing "-" are published as pre-releases).

on:
  push:
    tags: ['v*']
  # Manual dry run (Actions tab -> Release -> Run workflow): builds everything
  # and keeps the files as workflow artifacts, but publishes no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - id: v
        shell: bash
        run: |
          PUB=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*//; s/\+.*//')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
            if [ "$V" != "$PUB" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $PUB. Run: dart tool/bump_version.dart $V"
              exit 1
            fi
          else
            V="$PUB"
          fi
          APPV=$(grep -E "appVersion" lib/core/app_info.dart | sed -E "s/.*'([^']+)'.*/\1/")
          if [ "$V" != "$APPV" ]; then
            echo "::error::lib/core/app_info.dart says $APPV but the tag is $V."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - run: flutter pub get && flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get && flutter gen-l10n
      - run: dart tool/setup.dart
      # Android only installs an update over an existing app when both APKs are
      # signed with the SAME key. Keep the keystore safe: losing it means users
      # would have to uninstall before updating. See docs/RELEASE.md.
      - name: Build and sign both APKs
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE="$RUNNER_TEMP/release.jks"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. A release must be signed with your permanent key. See docs/GITHUB_GUIDE.md."
            exit 1
          else
            # Dry run / test build only: a throwaway key so the pipeline can be
            # tested before secrets exist. NEVER publish an APK built this way.
            echo "::warning::No signing secrets: using a THROWAWAY key. This APK is for testing only."
            export KEYSTORE="$RUNNER_TEMP/throwaway.jks"
            export KEY_ALIAS=throwaway KEYSTORE_PASSWORD=throwaway123 KEY_PASSWORD=throwaway123
            keytool -genkeypair -keystore "$KEYSTORE" -alias throwaway -keyalg RSA -keysize 2048 \
              -validity 30 -storepass throwaway123 -keypass throwaway123 -dname "CN=ZapDL CI test"
          fi
          tool/build_android.sh
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get; flutter gen-l10n
      - run: dart tool/setup.dart
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ needs.check.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\ZapDL-$v-windows-x64.zip"
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\windows\zapdl.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libnotify-dev
      - run: flutter pub get && flutter gen-l10n
      - run: dart tool/setup.dart
      - run: flutter build linux --release
      - run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf "dist/ZapDL-${{ needs.check.outputs.version }}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get && flutter gen-l10n
      - run: dart tool/setup.dart
      - run: flutter build macos --release
      # Unsigned and not notarized: macOS will warn on first open. Add Developer
      # ID signing and notarization (docs/RELEASE.md) for a smooth install.
      - run: |
          mkdir -p dist
          hdiutil create -volname ZapDL -srcfolder build/macos/Build/Products/Release/zapdl.app -ov -format UDZO "dist/ZapDL-${{ needs.check.outputs.version }}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  publish:
    needs: [check, android, windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum ZapDL-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          V="${{ needs.check.outputs.version }}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "ZapDL $V" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          [ "${{ needs.check.outputs.prerelease }}" = "true" ] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --title "ZapDL ${{ needs.check.outputs.version }}" --notes-file notes.md $FLAGS
